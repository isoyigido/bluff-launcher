name: Multi-OS Native Release

on:
  push:
    branches: [main, master]

jobs:
  build-and-package:
    name: Package Application
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: windows
            archive-cmd: Compress-Archive -Path dist/BluffLauncher/* -DestinationPath "dist/bluff-launcher-windows.zip"
          - os: macos-latest
            platform: macos
            archive-cmd: cd dist && zip -r "bluff-launcher-macOS.zip" .
          - os: ubuntu-latest
            platform: linux
            archive-cmd: cd dist && zip -r "bluff-launcher-linux.zip" .

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '24'

      - name: Compile Java Code
        shell: bash
        run: |
          mkdir -p out/bin out/artifacts
          javac -d out/bin $(find src -name "*.java")
          jar cfe out/artifacts/bluff-launcher.jar Main -C out/bin .

      - name: Generate Lightweight Runtime (jlink)
        shell: bash
        run: |
          $JAVA_HOME/bin/jlink \
            --add-modules java.base,java.desktop \
            --strip-debug \
            --no-man-pages \
            --no-header-files \
            --output out/runtime

      - name: Package Native Bundle (jpackage)
        shell: bash
        run: |
          mkdir -p dist
          $JAVA_HOME/bin/jpackage \
            --type app-image \
            --input out/artifacts \
            --main-jar bluff-launcher.jar \
            --main-class Main \
            --runtime-image out/runtime \
            --name "BluffLauncher" \
            --dest dist

      - name: Compress Bundle to Zip
        run: ${{ matrix.archive-cmd }}

      - name: Upload Temporary Platform Artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-zip-${{ matrix.platform }}
          path: dist/*.zip

  publish-release:
    name: Run Semantic Release
    needs: build-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Platform Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Run Semantic Release
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
            conventional-changelog-conventionalcommits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}